<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products - Inventory System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <script>
        function updateStock(productId, type) {
            const url = type === 'add' ? `/products/${productId}/add-stock` : `/products/${productId}/reduce-stock`;
            
            fetch(url, {
                method: 'POST',
                headers: { }
            }).then(response => {
                if(response.ok) {
                    location.reload();
                } else {
                    alert('Error updating stock');
                }
            });
        }

        function deleteProduct(productId) {
            if(confirm('Are you sure you want to delete this product?')) {
                fetch(`/products/${productId}/delete`, {
                    method: 'POST'
                }).then(response => {
                    if(response.ok) {
                        location.reload();
                    } else {
                        alert('Error deleting product');
                    }
                });
            }
        }
    </script>
</head>
<body>

<div class="navbar">
    <h2>Inventory System</h2>
    <div>
        <a th:href="@{/dashboard}">Back to Dashboard</a>
    </div>
</div>

<div class="container">
    <div class="header-flex">
        <h2>Manage Products</h2>
        <a th:href="@{/products/add}" class="btn btn-primary">➕ Add Product</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Stock Update</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Phone</td>
                <td th:text="${product.category}">Electronics</td>
                <td th:text="${product.price}">1000.0</td>
                <td th:text="${product.quantity}" th:style="${product.quantity < 100 ? 'color: red; font-weight: bold;' : ''}">10</td>
                <td>
                    <button class="btn btn-small btn-primary" th:onclick="'updateStock(' + ${product.id} + ',\'add\')'">🔵 +1</button>
                    <button class="btn btn-small btn-warning" th:onclick="'updateStock(' + ${product.id} + ',\'reduce\')'" th:disabled="${product.quantity <= 0}">🔴 -1</button>
                    <button class="btn btn-small btn-danger" th:onclick="'deleteProduct(' + ${product.id} + ')'" style="margin-left: 5px;">🗑️ Delete</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" style="text-align: center;">No products found</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
