<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Inventory System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: #2c3e50;">

<div class="login-container">
    <h2 style="text-align: center; margin-bottom: 20px;">Inventory System</h2>
    
    <div th:if="${param.error}" class="alert alert-danger">
        Invalid username or password.
    </div>
    
    <div th:if="${param.logout}" class="alert alert-success" style="background-color:#d4efdf; color:#27ae60;">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
</div>

</body>
</html>
