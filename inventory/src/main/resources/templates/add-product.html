<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product - Inventory System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <h2>Inventory System</h2>
    <div>
        <a th:href="@{/products}">Back to Products</a>
    </div>
</div>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 style="margin-bottom: 20px;">Add New Product</h2>
        
        <form th:action="@{/products/add}" method="post" th:object="${product}">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <!-- Using datalist for dropdown + custom text -->
                <input type="text" id="category" th:field="*{category}" class="form-control" list="categoryList" required>
                <datalist id="categoryList">
                    <option th:each="cat : ${categories}" th:value="${cat}"></option>
                </datalist>
            </div>
            
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" th:field="*{price}" class="form-control" step="0.01" min="0" required>
            </div>
            
            <div class="form-group">
                <label for="quantity">Initial Quantity</label>
                <input type="number" id="quantity" th:field="*{quantity}" class="form-control" min="0" max="500" required>
            </div>
            
            <div class="form-group">
                <label for="reorderLevel">Reorder Level (Low Stock Alert threshold)</label>
                <input type="number" id="reorderLevel" th:field="*{reorderLevel}" class="form-control" min="0" required>
            </div>
            
            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-success">Save Product</button>
                <a th:href="@{/products}" class="btn btn-secondary" style="margin-left: 10px;">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
